services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_pass
      POSTGRES_DB: weather_pipeline
    volumes:
      - weather_pipeline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_user -d weather_pipeline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  weather_pipeline_pgdata:
